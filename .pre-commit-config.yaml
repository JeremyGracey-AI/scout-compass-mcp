# Pre-commit hooks for scout-compass-mcp — file hygiene only.
# (No ESLint/Prettier is configured in this repo; TypeScript linting would be
# a separate decision. Build/type checks stay in `npm run build` and CI.)
# Install once per clone: pre-commit install
# Run manually:           pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
